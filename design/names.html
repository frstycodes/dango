<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name and mark</title>
<style>
@font-face { font-family: "Gabarito"; src: url("../assets/fonts/Gabarito-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Gabarito"; src: url("../assets/fonts/Gabarito-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Gabarito"; src: url("../assets/fonts/Gabarito-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Gabarito"; src: url("../assets/fonts/Gabarito-Bold.ttf"); font-weight: 700; }

:root {
  --page: #f8f9fb;
  --surface: #fdfdfe;
  --ink: #14161a;
  --muted: #55585e;
  --hairline: oklch(0.3 0.008 260 / 0.12);
  --fill: oklch(0.3 0.008 260 / 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111213;
    --surface: #17181a;
    --ink: #f3f5f8;
    --muted: #a0a5ac;
    --hairline: oklch(1 0 0 / 0.1);
    --fill: oklch(1 0 0 / 0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111213;
  --surface: #17181a;
  --ink: #f3f5f8;
  --muted: #a0a5ac;
  --hairline: oklch(1 0 0 / 0.1);
  --fill: oklch(1 0 0 / 0.06);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 16px/1.5 "Gabarito", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 96px; display: grid; gap: 48px; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
h1 { margin: 0; font-size: 36px; line-height: 1.1; font-weight: 700; }
h2 { margin: 0 0 16px; font-size: 20px; line-height: 1.2; font-weight: 600; }
p { margin: 4px 0 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }

.picker { display: grid; gap: 12px; }
.segments { display: flex; flex-wrap: wrap; }
.segments button {
  font: 500 14px/1 "Gabarito", sans-serif;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--hairline);
  margin-inline-start: -1px;
  height: 36px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.segments button:first-child { border-radius: 12px 0 0 12px; margin-inline-start: 0; }
.segments button:last-child { border-radius: 0 12px 12px 0; }
.segments button[aria-pressed="true"] { background: var(--fill); border-color: oklch(from var(--ink) l c h / 0.35); position: relative; z-index: 1; }
@media (hover: hover) and (pointer: fine) { .segments button:hover { background: var(--fill); } }
.segments button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; z-index: 2; }
.swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }

.marks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.mark-card {
  all: unset;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 20px;
  corner-shape: superellipse(1.4);
  padding: 16px;
  display: grid;
  gap: 12px;
  justify-items: center;
  text-align: center;
}
.mark-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mark-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mark-card strong { font-weight: 600; }
.mark-card span { color: var(--muted); font-size: 14px; }

.stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; corner-shape: superellipse(1.4); padding: 24px; }
.hero { display: grid; justify-items: center; gap: 16px; }
#hero svg { width: min(256px, 100%); height: auto; }
.tiles { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.tiles figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 14px; color: var(--muted); }
.sizes { display: flex; align-items: end; gap: 20px; flex-wrap: wrap; }
.sizes figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 32px; letter-spacing: -0.01em; }
.rail { width: 72px; padding: 12px 0; background: var(--fill); border-radius: 20px; corner-shape: superellipse(1.4); display: grid; justify-items: center; gap: 8px; }
.rail .home { width: 48px; height: 48px; border-radius: 16px; corner-shape: superellipse(1.4); background: var(--accent); display: grid; place-items: center; }
.rail .server { width: 48px; height: 48px; border-radius: 50%; background: oklch(from var(--ink) l c h / 0.12); }

.splashes { display: flex; gap: 16px; flex-wrap: wrap; }
.splash { width: 220px; height: 248px; border-radius: 20px; corner-shape: superellipse(1.4); display: grid; place-content: center; justify-items: center; gap: 10px; padding: 16px; }
.splash.light { background: #f8f9fb; color: #14161a; border: 1px solid rgb(43 46 50 / 0.16); }
.splash.dark { background: #0a0b0d; color: #f3f5f8; border: 1px solid rgb(255 255 255 / 0.16); }
.splash b { font-size: 20px; line-height: 1; margin-top: 4px; }
.splash small { font-size: 12px; font-weight: 500; opacity: 0.7; }
.splash .bar { width: 120px; height: 6px; border-radius: 3px; background: oklch(0.6 0.01 260 / 0.45); overflow: hidden; }
.splash .bar i { display: block; height: 100%; width: 42%; background: var(--accent); border-radius: 3px; }

.chat { display: grid; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; }
.msg .name { font-weight: 600; font-size: 14px; }
.msg .text { font-size: 14px; color: var(--muted); }
.button { font: 600 14px/1 "Gabarito", sans-serif; height: 32px; padding: 0 14px; border: 0; border-radius: 12px; corner-shape: superellipse(1.4); background: var(--accent); color: white; }
.mention { background: oklch(from var(--accent) l c h / 0.16); color: var(--accent-ink); border-radius: 4px; padding: 0 3px; font-weight: 500; }
.theme { font: 500 14px/1 "Gabarito", sans-serif; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">Waffle</h1>
      <p>The names explored before Waffle was picked, each with its own mark. Pick a name; everything below follows.</p>
    </div>
    <div class="segments theme" role="group" aria-label="Theme">
      <button type="button" data-theme-pick="light">Light</button>
      <button type="button" data-theme-pick="dark">Dark</button>
      <button type="button" data-theme-pick="system" aria-pressed="true">System</button>
    </div>
  </header>

  <section class="picker">
    <h2>Name</h2>
    <div class="marks" id="marks"></div>
  </section>

  <section class="picker">
    <h2>Accent</h2>
    <div class="segments" id="accents" role="group" aria-label="Accent"></div>
    <p id="accent-note"></p>
  </section>

  <section class="stage">
    <div class="panel hero">
      <h2>App icon</h2>
      <div id="hero"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="panel">
      <h2>Small sizes</h2>
      <div class="sizes" id="sizes"></div>
      <h2 style="margin-top:32px">Wordmark</h2>
      <div class="row"><span class="wordmark" id="wordmark"></span></div>
      <h2 style="margin-top:32px">In the app</h2>
      <div class="row" style="align-items:start">
        <div class="rail" id="rail"></div>
        <div class="chat">
          <div class="msg"><span class="avatar" style="background:#e9b872"></span><div><div class="name">Mina</div><div class="text">taro or brown sugar <span class="mention">@you</span>?</div></div></div>
          <div class="msg"><span class="avatar" style="background:#8fb6d9"></span><div><div class="name">Jun</div><div class="text">both, extra pearls</div></div></div>
          <div><button class="button" type="button">Join voice</button></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Splash</h2>
      <div class="splashes" id="splashes"></div>
    </div>
  </section>
</main>

<script>
const ACCENTS = [
  { id: "ramune", name: "Ramune", c: "#0B9BA8", deep: "#015259", light: "#56D2DF", fg: "#fff", note: "Today's accent: soda-glass teal." },
  { id: "chili", name: "Chili", c: "#E25B26", deep: "#8F2A17", light: "#FF9A82", fg: "#fff", note: "The previous accent, for comparison." },
];

const NAMES = [
  { id: "pickle", name: "Pickle", hint: "English: a gherkin; also a playful little mess", accent: "ramune" },
  { id: "peanut", name: "Peanut", hint: "English: two in one shell; a pet name for a little one", accent: "ramune" },
  { id: "waffle", name: "Waffle", hint: "Belgian: a grid of pockets; also, to chat on and on", accent: "ramune" },
  { id: "olive", name: "Olive", hint: "Mediterranean: the pimento is its eye", accent: "ramune" },
  { id: "nugget", name: "Nugget", hint: "English: a small lump of something good", accent: "ramune" },
  { id: "toast", name: "Toast", hint: "English: a slice of bread; also raising a glass to someone", accent: "ramune" },
  { id: "macaron", name: "Macaron", hint: "French: two shells and a filling", accent: "ramune" },
  { id: "churro", name: "Churro", hint: "Spanish: a ridged fried stick rolled in sugar", accent: "ramune" },
  { id: "ladoo", name: "Ladoo", hint: "Indian: a round sweet made of tiny pearls", accent: "ramune" },
  { id: "blip", name: "Blip", hint: "English: a small flash or sound on a screen, like a new message", accent: "ramune" },
  { id: "tofu", name: "Tofu", hint: "A soft, slightly slumped block with one eye, Mochi's sibling", accent: "ramune" },
  { id: "musubi", name: "Musubi", hint: "Rice ball; also Japanese for tying together, a bond", accent: "ramune" },
  { id: "taiyaki", name: "Taiyaki", hint: "Fish-shaped cake, warm from the iron", accent: "ramune" },
  { id: "maki", name: "Maki", hint: "A sushi roll, cut: the filling is its eye", accent: "ramune" },
  { id: "mikan", name: "Mikan", hint: "Winter mandarin with a leaf on top", accent: "ramune" },
  { id: "uni", name: "Uni", hint: "Sea urchin: spiky outside, soft inside", accent: "ramune" },
  { id: "tama", name: "Tama", hint: "Egg, or a little ball; a classic cat name", accent: "ramune" },
  { id: "inari", name: "Inari", hint: "A sweet fried-tofu pouch, rice peeking out", accent: "ramune" },
  { id: "miso", name: "Miso", hint: "A bowl of miso soup, a cube of tofu bobbing", accent: "ramune" },
  { id: "ramune", name: "Ramune", hint: "Marble soda: the pinched bottle with its glass marble", accent: "ramune" },
  { id: "awa", name: "Awa", hint: "Japanese for bubble: three rising, like a typing indicator", accent: "ramune" },
  { id: "marble", name: "Marble", hint: "The ramune marble: one glass sphere with a swirl", accent: "ramune" },
  { id: "kori", name: "Kori", hint: "Japanese for ice: a shaved-ice mound in a cup", accent: "ramune" },
  { id: "kumo", name: "Kumo", hint: "Japanese for cloud: soft, and shaped like a chat bubble", accent: "ramune" },
  { id: "mame", name: "Mame", hint: "Japanese for bean: three in a pod, like a typing indicator", accent: "ramune" },
  { id: "tako", name: "Tako", hint: "Octopus: eight arms for eight conversations", accent: "ramune" },
  { id: "purin", name: "Purin", hint: "Japanese custard pudding, caramel on top", accent: "ramune" },
  { id: "umi", name: "Umi", hint: "Japanese for sea: three waves rolling in", accent: "ramune" },
];

let uid = 0;

// A soft top-left shine.
function shine(cx, cy, r, opacity = 0.5) {
  return `<ellipse cx="${cx - r * 0.33}" cy="${cy - r * 0.36}" rx="${r * 0.3}" ry="${r * 0.2}" fill="#fff" opacity="${opacity}" transform="rotate(-30 ${cx - r * 0.33} ${cy - r * 0.36})"/>`;
}

// Marks are drawn in a 100x100 box. `ink` is the main shape, `on` sits on top of it (and is the
// backdrop colour, for separations), `stick` the secondary shade.
function markSvg(id, { ink, on, stick }) {
  switch (id) {
    case "tofu":
      return `<path d="M24 44C24 34 28 30 37 30C47 30 56 28 64 29C73 30 77 35 77 44L80 72C80 78 76 81 70 81H30C24 81 20 78 20 72Z" fill="${ink}"/>` + eye(58, 48, ink, on);
    case "musubi":
      return `<path d="M50 16C56 16 60 20 63 26L83 64C89 76 83 85 70 85H30C17 85 11 76 17 64L37 26C40 20 44 16 50 16Z" fill="${ink}"/>` +
        `<path d="M34 62H66V85H34Z" fill="${stick}"/>` + eye(57, 44, ink, on);
    case "taiyaki":
      return `<path d="M12 52C18 33 44 25 62 32L80 21C85 18 89 22 88 27L83 51L88 75C89 80 85 84 80 81L62 70C44 77 18 71 12 52Z" fill="${ink}"/>` +
        `<g fill="none" stroke="${on}" stroke-width="2.6" stroke-linecap="round" opacity="0.4"><path d="M46 42Q50 48 46 54"/><path d="M54 40Q58 48 54 56"/><path d="M46 56Q50 62 46 66"/></g>` + eye(30, 46, ink, on);
    case "maki":
      return `<circle cx="50" cy="50" r="38" fill="${ink}"/><circle cx="50" cy="50" r="30" fill="${on}"/>` +
        `<circle cx="56" cy="45" r="11" fill="${ink}"/><circle cx="59.5" cy="41.5" r="3.4" fill="${on}"/>`;
    case "mikan":
      return `<circle cx="50" cy="56" r="32" fill="${ink}"/>` +
        `<path d="M50 25V17" stroke="${stick}" stroke-width="4" stroke-linecap="round"/><path d="M51 20C56 10 68 9 74 14C68 22 58 24 51 20Z" fill="${stick}"/>` + eye(60, 50, ink, on) + shine(50, 56, 32, 0.3);
    case "uni": {
      const pts = [];
      for (let i = 0; i < 32; i++) {
        const a = (i / 32) * Math.PI * 2, r = i % 2 ? 29 : 39;
        pts.push(`${(50 + r * Math.cos(a)).toFixed(1)} ${(52 + r * Math.sin(a)).toFixed(1)}`);
      }
      return `<path d="M${pts.join("L")}Z" fill="${ink}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>` + eye(58, 46, ink, on);
    }
    case "tama":
      return `<path d="M50 14C68 14 80 40 80 60C80 78 66 88 50 88C34 88 20 78 20 60C20 40 32 14 50 14Z" fill="${ink}"/>` + eye(58, 50, ink, on);
    case "inari":
      return `<path d="M18 52C18 38 30 32 50 32C70 32 82 38 82 52V70C82 80 72 84 50 84C28 84 18 80 18 70Z" fill="${ink}"/>` +
        `<path d="M22 48C22 34 34 26 50 26C66 26 78 34 78 48C66 42 34 42 22 48Z" fill="${on}" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>` + eye(60, 62, ink, on);
    case "miso":
      return `<rect x="56" y="30" width="16" height="14" rx="3" fill="${on}" stroke="${ink}" stroke-width="3.5" transform="rotate(10 64 37)"/>` +
        `<path d="M14 44H86C86 68 70 86 50 86C30 86 14 68 14 44Z" fill="${ink}"/>` +
        `<rect x="12" y="40" width="76" height="7" rx="3.5" fill="${stick}"/>` + eye(58, 62, ink, on);
    case "ramune":
      return `<rect x="41" y="7" width="18" height="7" rx="3" fill="${stick}"/>` +
        `<path d="M28 78V58C28 49 40 45 40 39C40 35 43 33 43 30C43 27 40 25 40 21V17Q40 13 44 13H56Q60 13 60 17V21C60 25 57 27 57 30C57 33 60 35 60 39C60 45 72 49 72 58V78Q72 90 60 90H40Q28 90 28 78Z" fill="${ink}"/>` +
        `<circle cx="50" cy="38" r="6.5" fill="${on}" opacity="0.9"/>` +
        `<path d="M28 66H72" stroke="${on}" stroke-width="3" opacity="0.4"/>` + shine(40, 74, 12, 0.4);
    case "awa":
      return [[34, 66, 20], [62, 42, 13], [76, 20, 8]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}"/>` + shine(x, y, r, 0.55)).join("");
    case "marble":
      return `<circle cx="50" cy="50" r="38" fill="${ink}"/>` +
        `<path d="M20 57C34 38 46 71 62 48C68 40 74 40 80 44" fill="none" stroke="${on}" stroke-width="8" stroke-linecap="round" opacity="0.7"/>` +
        `<path d="M26 70C40 58 52 80 70 66" fill="none" stroke="${on}" stroke-width="4" stroke-linecap="round" opacity="0.35"/>` + shine(50, 50, 38, 0.45);
    case "kori":
      return `<path d="M20 62C20 38 34 20 50 20C66 20 80 38 80 62Z" fill="${ink}"/>` +
        `<path d="M50 20C46 30 47 40 52 48" fill="none" stroke="${on}" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>` +
        `<path d="M24 64H76L68 87Q67 90 64 90H36Q33 90 32 87Z" fill="${stick}"/>` +
        `<rect x="22" y="61" width="56" height="6" rx="3" fill="${on}"/>` + shine(40, 44, 18, 0.4);
    case "kumo":
      return `<g transform="translate(50 50) scale(1.25) translate(-50 -60)"><path d="M30 78H70A16 16 0 0 0 72 46A22 22 0 0 0 30 42A18 18 0 0 0 30 78Z" fill="${ink}"/>` +
        `<circle cx="22" cy="86" r="5" fill="${ink}"/>` + shine(46, 52, 20, 0.45) + `</g>`;
    case "mame":
      return `<line x1="74" y1="26" x2="85" y2="15" stroke="${stick}" stroke-width="5" stroke-linecap="round"/>` +
        `<line x1="28" y1="72" x2="72" y2="28" stroke="${ink}" stroke-width="32" stroke-linecap="round"/>` +
        [[33, 67], [50, 50], [67, 33]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="${on}" opacity="0.35"/>` + shine(x, y, 9, 0.6)).join("");
    case "tako":
      return `<g fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"><path d="M30 54C28 66 22 70 18 78"/><path d="M43 56C42 68 38 76 36 86"/><path d="M57 56C58 68 62 76 64 86"/><path d="M70 54C72 66 78 70 82 78"/></g>` +
        `<path d="M24 58C24 34 36 18 50 18C64 18 76 34 76 58Z" fill="${ink}"/>` +
        `<circle cx="41" cy="44" r="4" fill="${on}"/><circle cx="59" cy="44" r="4" fill="${on}"/>` + shine(44, 36, 16, 0.4);
    case "purin":
      return `<g transform="translate(50 50) scale(1.3) translate(-50 -60)">` + `<rect x="16" y="82" width="68" height="7" rx="3.5" fill="${stick}" opacity="0.6"/>` +
        `<path d="M28 82L34 40Q35 33 42 33H58Q65 33 66 40L72 82Z" fill="${ink}"/>` +
        `<path d="M34 40Q35 33 42 33H58Q65 33 66 40L67.2 49Q50 56 32.8 49Z" fill="${stick}"/>` + shine(44, 60, 14, 0.4) + `</g>`;
    case "umi":
      return [[36, 1], [54, 0.65], [72, 0.35]].map(([y, o]) => `<path d="M14 ${y}C22 ${y - 12} 34 ${y - 12} 42 ${y}S62 ${y + 12} 70 ${y}S84 ${y - 10} 88 ${y - 4}" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${o}"/>`).join("");
  }
}

// The one eye every character wears; the glint keeps it an eye rather than a dot or a die's pip.
function eye(x, y, ink, on, r = 6.25) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${on}"/><circle cx="${x + r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.3}" fill="${ink}"/>`;
}

// iOS-like continuous corners: a superellipse with exponent 5.
function squirclePath(size) {
  const n = 5, a = size / 2, pts = [];
  for (let i = 0; i < 128; i++) {
    const t = (i / 128) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    pts.push([a + a * Math.sign(c) * Math.abs(c) ** (2 / n), a + a * Math.sign(s) * Math.abs(s) ** (2 / n)]);
  }
  return "M" + pts.map(p => p.map(v => v.toFixed(2)).join(" ")).join("L") + "Z";
}

const TILES = {
  bone: a => ({ bg: ["#FBF8F2", "#EDE6DA"], ink: a.c, on: "#F6F1E8", stick: "#C9A27A", label: "Bone" }),
  brand: a => ({ bg: [a.light, a.c], ink: "#FFFFFF", on: a.c, stick: a.deep, label: "Brand" }),
  graphite: a => ({ bg: ["#3A3438", "#17131A"], ink: a.light, on: "#221D22", stick: "#8C7A6A", label: "Graphite" }),
};

const state = { name: "tofu", accent: "ramune" };
const current = () => NAMES.find(n => n.id === state.name);

function icon(markId, accent, tile, px) {
  const t = TILES[tile](accent), id = `g${uid++}`, inset = 0.13;
  return `<svg width="${px}" height="${px}" viewBox="0 0 100 100" role="img" aria-label="${NAMES.find(n => n.id === markId).name} ${t.label} icon">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="${t.bg[0]}"/><stop offset="1" stop-color="${t.bg[1]}"/></linearGradient></defs>
    <path d="${squirclePath(100)}" fill="url(#${id})"/>
    <g transform="translate(${inset * 100} ${inset * 100}) scale(${1 - inset * 2})">${markSvg(markId, t)}</g>
  </svg>`;
}

function bareMark(markId, accent, px, ink, on, stick = accent.deep) {
  return `<svg width="${px}" height="${px}" viewBox="0 0 100 100" aria-hidden="true">${markSvg(markId, { ink, on, stick })}</svg>`;
}

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
}

function render() {
  const a = ACCENTS.find(x => x.id === state.accent), name = current();
  const root = document.documentElement.style;
  root.setProperty("--accent", a.c);
  root.setProperty("--accent-ink", isDark() ? a.light : a.deep);
  document.title = `${name.name}: name and mark`;
  document.getElementById("title").textContent = name.name;

  document.getElementById("marks").innerHTML = NAMES.map(m =>
    `<button class="mark-card" type="button" data-mark="${m.id}" aria-pressed="${m.id === state.name}">
      ${icon(m.id, a, "bone", 96)}<strong>${m.name}</strong><span>${m.hint}</span></button>`).join("");
  document.getElementById("accents").innerHTML = ACCENTS.map(x =>
    `<button type="button" data-accent="${x.id}" aria-pressed="${x.id === state.accent}"><span class="swatch" style="--c:${x.c}"></span>${x.name}</button>`).join("");
  document.getElementById("accent-note").textContent = a.note;

  document.getElementById("hero").innerHTML = icon(state.name, a, "bone", 256);
  document.getElementById("tiles").innerHTML = Object.keys(TILES).map(k =>
    `<figure>${icon(state.name, a, k, 96)}<figcaption>${TILES[k](a).label}</figcaption></figure>`).join("");
  document.getElementById("sizes").innerHTML = [128, 56, 32, 16].map(px =>
    `<figure>${icon(state.name, a, "bone", px)}<figcaption>${px}</figcaption></figure>`).join("") +
    [32, 16].map(px => `<figure>${icon(state.name, a, "graphite", px)}<figcaption>${px} dark</figcaption></figure>`).join("");
  const surface = isDark() ? "#17181a" : "#fdfdfe";
  document.getElementById("wordmark").innerHTML = bareMark(state.name, a, 40, a.c, surface, isDark() ? "#8C7A6A" : "#C9A27A") + name.name;
  document.getElementById("rail").innerHTML = `<span class="home">${bareMark(state.name, a, 30, "#fff", a.c, a.deep)}</span><span class="server"></span><span class="server"></span>`;
  document.querySelector(".button").style.color = a.fg;
  document.getElementById("splashes").innerHTML = [["light", "#f8f9fb", "#C9A27A"], ["dark", "#0a0b0d", "#8C7A6A"]].map(([k, bg, stick]) =>
    `<div class="splash ${k}">${bareMark(state.name, a, 56, k === "light" ? a.c : a.light, bg, stick)}<b>${name.name}</b><small>Updating to 0.2.0…</small><span class="bar"><i></i></span></div>`).join("");
}

document.addEventListener("click", e => {
  const mark = e.target.closest("[data-mark]");
  const accent = e.target.closest("[data-accent]");
  const theme = e.target.closest("[data-theme-pick]");
  if (mark) {
    state.name = mark.dataset.mark;
    state.accent = current().accent;
  }
  if (accent) state.accent = accent.dataset.accent;
  if (theme) {
    const pick = theme.dataset.themePick;
    if (pick === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = pick;
    document.querySelectorAll("[data-theme-pick]").forEach(b => b.setAttribute("aria-pressed", b === theme));
  }
  if (mark || accent || theme) render();
});

render();
</script>
</body>
</html>
