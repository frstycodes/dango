[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["component", "assets"] }
gpui-motion-kit = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
emojis = "0.6"
image = { version = "0.25", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
davey = "0.2"
opus = "0.4"
cpal = "0.18"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
openh264 = "0.9"
mp4 = "0.14"
notify-rust = "4"
sonora = "0.3"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
screencapturekit = { version = "11", features = ["macos_14_0"] }

# RSA key generation takes seconds unoptimised; dependencies build optimised even in debug.
[profile.dev.package."*"]
opt-level = 2
