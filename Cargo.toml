[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["component", "assets"] }
gpui-motion-kit = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
emojis = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
davey = "0.2"
opus = "0.4"
cpal = "0.18"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
openh264 = "0.9"
mp4 = "0.14"
notify-rust = "4"
sonora = "0.3"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet3 (MIT/Apache-2.0) with its bundled model on the tract backend: the Krisp-tier noise
# suppressor. crates.io only has the pre-tract 0.2 line, so this pins the upstream repo.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"] }
# deep_filter is written against ndarray 0.15; tract moved to ndarray 0.16 in 0.21.7, so tract stays
# on 0.21.4, the version upstream's own lockfile builds with (0.21.5+ renamed `symbol_table`).
ndarray = "0.15"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
# Port of WebRTC's GMM voice activity detector: what Discord runs for automatic sensitivity
# without Advanced Voice Activity (vadAutoThreshold = VERY_AGGRESSIVE). 0.1 is the WebRTC port.
earshot = "=0.1.0"
socket2 = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "symphonia-aac"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
screencapturekit = { version = "11", features = ["macos_14_0"] }

# RSA key generation takes seconds unoptimised; dependencies build optimised even in debug.
[profile.dev.package."*"]
opt-level = 2

# tract 0.21.4's debug-only graph check rejects DeepFilterNet3's encoder ("duplicate name
# /convt3/Conv.bias") although release builds run it fine; debug builds skip the check like release.
[profile.dev.package.tract-core]
debug-assertions = false

# Go Live on Windows: Windows.Graphics.Capture for video, WASAPI (process) loopback for audio, and the
# Media Foundation H.264 encoder (hardware MFTs: NVENC, Quick Sync, AMF) with OpenH264 as fallback.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0"
wasapi = "0.27"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
