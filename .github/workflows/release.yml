# Push a `v*` tag matching Cargo.toml's version to build and publish a release: installers (.dmg,
# setup .exe) for people, plus the zipped .app and zipped Dango.exe the updater swaps in. Asset names
# must match `asset_name` in src/updater.rs; each asset gets a `<name>.sha256` the updater verifies.
# Pushes to main run the same builds and packaging without publishing, which keeps every target
# building and fills the shared cache.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      # Re-running a tag keeps its release and replaces its assets.
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Dango $TAG" --generate-notes

  build:
    needs: create
    # Runs on main too, where `create` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset` is what the updater downloads; `installer` is what people install from; `legacy` is the
          # bare .exe that v0.4.0 and older still update from (72 MB; deflate shrinks it to roughly the installer's size).
          - { os: macos-latest, target: aarch64-apple-darwin, asset: dango-macos-aarch64.zip, installer: dango-macos-aarch64.dmg }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: dango-macos-x86_64.zip, installer: dango-macos-x86_64.dmg }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: dango-windows-x86_64.zip, installer: dango-windows-x86_64-setup.exe, legacy: dango-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The macOS image is nearly full; a release build plus the .dmg ran out of space. Dango never
      # uses the preinstalled Android SDK.
      - name: Free disk space
        if: runner.os == 'macOS'
        run: df -h / && sudo rm -rf "$HOME/Library/Android" && df -h /
      - run: rustup target add ${{ matrix.target }}
      # One cache per target for all of CI: a run can restore caches saved on its own ref or on main,
      # never another tag's, so only main saves and every other ref (tags, branches) reads it.
      # Any new workflow should use the same shared-key and save-if, and build the release profile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dango-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Even on a full rust-cache hit, the crates in this repo (vendor/gpui-pre*) and everything built on
      # them recompile every run; sccache keys each compile by its inputs, so those come back too.
      # Binaries and proc-macros still compile every time: sccache only caches libraries.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - run: sccache --show-stats

      - name: Package Dango.app
        if: runner.os == 'macOS'
        run: |
          app=Dango.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp target/${{ matrix.target }}/release/dango $app/Contents/MacOS/dango
          # Bridge for v0.4.0 and older: their updater relaunches Contents/MacOS/rustcord after swapping the bundle.
          ln -s dango $app/Contents/MacOS/rustcord
          cp assets/macos/AppIcon.icns $app/Contents/Resources/AppIcon.icns
          cat > $app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Dango</string>
            <key>CFBundleDisplayName</key><string>Dango</string>
            <key>CFBundleIdentifier</key><string>com.frstycodes.dango</string>
            <key>CFBundleExecutable</key><string>dango</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Dango uses the microphone for voice calls.</string>
            <key>NSCameraUsageDescription</key><string>Dango uses the camera for video calls.</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - $app
          ditto -c -k --keepParent $app ${{ matrix.asset }}
          mkdir dmg && cp -R $app dmg/ && ln -s /Applications dmg/Applications
          # The mounted volume shows the app icon too: a .VolumeIcon.icns plus the custom-icon flag, which
          # only sticks when set on the mounted volume, so build read-write, flag it, then compress.
          cp assets/macos/AppIcon.icns dmg/.VolumeIcon.icns
          hdiutil create -volname Dango -srcfolder dmg -format UDRW -ov rw.dmg
          hdiutil attach -nobrowse -mountpoint mnt rw.dmg
          SetFile -a C mnt
          hdiutil detach mnt
          hdiutil convert rw.dmg -format UDZO -ov -o ${{ matrix.installer }}

      - name: Package exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/dango.exe Dango.exe
          Copy-Item Dango.exe ${{ matrix.legacy }}
          Compress-Archive -Path Dango.exe -DestinationPath ${{ matrix.asset }}

      - name: Build setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$env:VERSION" "/DExe=$PWD\Dango.exe" "/O$PWD" packaging\windows\dango.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Git Bash on Windows has sha256sum; macOS has shasum. Both print "<hex> <name>".
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for file in ${{ matrix.asset }} ${{ matrix.installer }} ${{ matrix.legacy }}; do
            $sum "$file" > "$file.sha256"
            gh release upload "$TAG" "$file" "$file.sha256" --clobber
          done
