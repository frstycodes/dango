# Push a `v*` tag matching Cargo.toml's version to build and publish a release. Asset names must
# match `asset_name` in src/updater.rs; each asset gets a `<name>.sha256` the updater verifies.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: gh release create "$TAG" --title "Wave $TAG" --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: wave-macos-aarch64.zip }
          - { os: macos-14, target: x86_64-apple-darwin, asset: wave-macos-x86_64.zip }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: wave-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Wave.app
        if: runner.os == 'macOS'
        run: |
          app=Wave.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp target/${{ matrix.target }}/release/rustcord $app/Contents/MacOS/rustcord
          cat > $app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Wave</string>
            <key>CFBundleDisplayName</key><string>Wave</string>
            <key>CFBundleIdentifier</key><string>com.frstycodes.wave</string>
            <key>CFBundleExecutable</key><string>rustcord</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Wave uses the microphone for voice calls.</string>
            <key>NSCameraUsageDescription</key><string>Wave uses the camera for video calls.</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - $app
          ditto -c -k --keepParent $app ${{ matrix.asset }}

      - name: Package exe
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/rustcord.exe ${{ matrix.asset }}

      - name: Upload
        run: |
          # Git Bash on Windows has sha256sum; macOS has shasum. Both print "<hex> <name>".
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          $sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          gh release upload "$TAG" ${{ matrix.asset }} ${{ matrix.asset }}.sha256 --clobber
